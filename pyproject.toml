[project]
name = "eyelink1000plus-pupil-size-to-mm"
version = "0.1.0"
description = "EyeLink 1000 Plus pupil-size calibration (arbitrary units → mm) via an artificial-eye recording."
authors = [
    { name = "Mohammadhossein Salari", email = "mohammadhossein.salari@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyelink[pyglet]>=1.1.5",
    "sr-research-pylink>=2.1.1145.post1",
]

[project.scripts]
eyelink1000plus-pupil-size-to-mm = "eyelink1000plus_pupil_size_to_mm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eyelink1000plus_pupil_size_to_mm"]
